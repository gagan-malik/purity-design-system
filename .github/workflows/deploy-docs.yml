name: Deploy Docs Site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'design-system/src/**'
      - 'design-system/.storybook/**'
      - 'design-system/package.json'
      - 'design-system/yarn.lock'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Required because design-system/.npmrc references ${NPM_TOKEN}, and Yarn evaluates
      # env replacements during setup-node's cache step (before our install step runs).
      NPM_TOKEN: ${{ secrets.NPM_TOKEN || 'dummy' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: |
            yarn.lock
            design-system/yarn.lock

      - name: Install dependencies
        working-directory: ./
        env:
          # Required because design-system/.npmrc references ${NPM_TOKEN}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || 'dummy' }}
        run: |
          echo "📦 Installing dependencies..."
          yarn install --frozen-lockfile
          echo "✅ Dependencies installed"

      - name: Build marketing site (Apple-style index)
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          echo "🏗️ Building marketing site..."
          node website/scripts/build.mjs
          test -f website/dist/index.html
          echo "✅ Marketing site built"

      - name: Build Storybook
        working-directory: ./design-system
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || 'dummy' }}
        run: |
          echo "🏗️ Building Storybook..."
          yarn build-storybook -- --output-dir ../website/dist/storybook
          echo "✅ Storybook built successfully"

      - name: Verify build output exists
        run: |
          test -d "website/dist"
          test -f "website/dist/index.html"
          test -d "website/dist/storybook"
          test -f "website/dist/storybook/index.html"
          echo "✅ Build output verified"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        if: success()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/dist
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          keep_files: false
          force_orphan: true
