# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: design-system/yarn.lock
      - name: Install dependencies
        working-directory: ./design-system
        env:
          # Required because design-system/.npmrc references ${NPM_TOKEN}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || 'dummy' }}
        run: yarn install --frozen-lockfile
      - name: Build library
        working-directory: ./design-system
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || 'dummy' }}
        run: yarn rollup

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
          cache: 'yarn'
          cache-dependency-path: design-system/yarn.lock
      - name: Install dependencies
        working-directory: ./design-system
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
        run: yarn install --frozen-lockfile
      - name: Build library
        working-directory: ./design-system
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
        run: yarn rollup
      - name: Publish to GitHub Packages
        working-directory: ./design-system
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For design-system/.npmrc env replacement
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
